<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-white to-gray-50 dark:from-primary dark:to-primary-light p-4">
  <div class="w-full max-w-md">
    <!-- Card -->
    <div class="card p-8">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-accent to-accent-light mb-4">
          <i-lucide name="briefcase" class="w-8 h-8 text-white"></i-lucide>
        </div>
        <h1 class="text-3xl font-bold text-primary dark:text-secondary mb-2">PFE Management</h1>
        <p class="text-gray-600 dark:text-gray-400">Gestion des stages PFE</p>
      </div>

      <!-- Title -->
      <h2 class="text-2xl font-bold text-primary dark:text-secondary mb-6 text-center">Connexion</h2>

      <!-- Form -->
      <form (ngSubmit)="handleLogin()" class="space-y-4">
        <!-- Email Input -->
        <div>
          <label class="block text-sm font-medium text-primary dark:text-secondary mb-2">Email</label>
          <input type="email"
                 [(ngModel)]="email"
                 name="email"
                 placeholder="votre.email@example.com"
                 class="input"
                 [disabled]="isLoading">
        </div>

        <!-- Password Input -->
        <div>
          <label class="block text-sm font-medium text-primary dark:text-secondary mb-2">Mot de passe</label>
          <div class="relative">
            <input [type]="showPassword ? 'text' : 'password'"
                   [(ngModel)]="password"
                   name="password"
                   placeholder="Entrez votre mot de passe"
                   class="input"
                   [disabled]="isLoading">
            <button type="button"
                    (click)="togglePasswordVisibility()"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary dark:hover:text-secondary">
              <i-lucide *ngIf="!showPassword" name="eye" class="w-5 h-5"></i-lucide>
              <i-lucide *ngIf="showPassword" name="eye-off" class="w-5 h-5"></i-lucide>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit"
                [disabled]="isLoading"
                class="w-full btn btn-primary mt-6">
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading" class="flex items-center justify-center gap-2">
            <i-lucide name="loader" class="w-4 h-4 animate-spin"></i-lucide>
            Connexion en cours...
          </span>
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-300 dark:border-gray-600"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-secondary dark:bg-primary-light text-gray-600 dark:text-gray-400">Ou</span>
        </div>
      </div>

      <!-- Register Link -->
      <p class="text-center text-gray-600 dark:text-gray-400">
        Pas encore de compte?
        <a routerLink="/register" class="text-accent font-semibold hover:text-accent-light transition-colors">
          S&apos;inscrire
        </a>
      </p>

      <!-- Demo Credentials -->
      <div class="mt-8 p-4 bg-blue-50 dark:bg-blue-900 rounded-lg border border-blue-200 dark:border-blue-800">
        <p class="text-sm font-semibold text-blue-900 dark:text-blue-300 mb-2">Identifiants de démonstration:</p>
        <ul class="text-xs text-blue-800 dark:text-blue-400 space-y-1">
          <li><strong>Admin:</strong> admin@pfe.com / password</li>
          <li><strong>Encadrant:</strong> encadrant@pfe.com / password</li>
          <li><strong>Étudiant:</strong> etudiant@pfe.com / password</li>
        </ul>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-sm text-gray-600 dark:text-gray-400 mt-6">
      © 2024 PFE Management. Tous droits réservés.
    </p>
  </div>
</div>
